<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strix Visuals — Key System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #58a6ff;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-generate {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-generate:hover {
            background-color: #2ea043;
        }
        .btn-generate:disabled {
            background-color: #30363d;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .key-container {
            margin-top: 20px;
            display: none;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #58a6ff;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            user-select: text;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Strix Key System</h2>
        <p id="statusText">Initializing secure session...</p>

        <button id="generateBtn" class="btn-generate" disabled>Loading...</button>

        <div id="keyBox" class="key-container">
            <input type="text" id="keyOutput" readonly>
        </div>

        <div class="footer">Secure Anti-Bypass System</div>
    </div>

    <script>
        let sessionToken = null;
        const generateBtn = document.getElementById('generateBtn');
        const statusText = document.getElementById('statusText');
        const keyBox = document.getElementById('keyBox');
        const keyOutput = document.getElementById('keyOutput');

        // Непрерывное изменение URL на максимальной частоте кадров браузера
        function continuousURLChaos() {
            const randomHash = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?token=' + randomHash;
            window.history.replaceState({path: newUrl}, '', newUrl);
            
            // Запускаем бесконечный цикл обновления
            requestAnimationFrame(continuousURLChaos);
        }

        // Получаем защитный токен с сервера при загрузке
        async function initSession() {
            try {
                let response = await fetch('/api/get-token');
                let data = await response.json();
                if (data.success) {
                    sessionToken = data.token;
                    generateBtn.disabled = false;
                    generateBtn.innerText = "Get Your Key";
                    statusText.innerText = "Click the button below to generate your 7-day access key.";
                    
                    // Запускаем хаос в адресной строке сразу после инициализации токена
                    requestAnimationFrame(continuousURLChaos);
                } else {
                    statusText.innerText = "Failed to initialize security session.";
                }
            } catch (error) {
                statusText.innerText = "Connection error with server.";
            }
        }

        initSession();

        generateBtn.addEventListener('click', async () => {
            if (!sessionToken) return;

            generateBtn.innerText = "Generating...";
            generateBtn.disabled = true;

            try {
                let response = await fetch("/api/generate-key", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: sessionToken })
                });

                let data = await response.json();

                if (data.success) {
                    keyOutput.value = data.key;
                    keyBox.style.display = "block";
                    generateBtn.style.display = "none";
                    statusText.innerText = "Your key has been successfully generated!";
                    keyOutput.select();
                } else {
                    alert(data.message || "Error generating key.");
                    generateBtn.innerText = "Get Your Key";
                    generateBtn.disabled = false;
                }
            } catch (error) {
                console.error("Connection error:", error);
                alert("Failed to connect to the server.");
                generateBtn.innerText = "Get Your Key";
                generateBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
