<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Система ключей Strix Visuals</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background: #4CAF50; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 4px; font-size: 16px; width: 100%; margin-top: 10px; }
        button:hover { background: #45a049; }
        input { width: 90%; padding: 10px; margin-top: 15px; background: #2d2d2d; border: 1px solid #444; color: #fff; text-align: center; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Strix Key System</h2>
        <p>Пройди необходимые задания, затем нажми кнопку ниже, чтобы получить ключ.</p>
        <button id="generateBtn">Получить ключ</button>
        <br>
        <input type="text" id="keyOutput" readonly placeholder="Твой ключ появится здесь...">
    </div>

    <script>
        // Ссылка на твой бэкенд (главный адрес сайта)
        const BACKEND_URL = "/api/generate-key";

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const btn = document.getElementById('generateBtn');
            const keyInput = document.getElementById('keyOutput');
            
            btn.innerText = "Генерация...";
            btn.disabled = true;

            try {
                let response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                let data = await response.json();

                if (data.success) {
                    keyInput.value = data.key;
                    btn.innerText = "Ключ получен!";
                    keyInput.select();
                } else {
                    alert("Ошибка при создании ключа.");
                    btn.innerText = "Получить ключ";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Ошибка связи:", error);
                alert("Не удалось подключиться к серверу.");
                btn.innerText = "Получить ключ";
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
